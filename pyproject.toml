[project]
name = "time-series-atlas"
version = "0.1.0"
description = "Question-led time series investigations with inspectable evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
atlas = "tsatlas.cli:main"
